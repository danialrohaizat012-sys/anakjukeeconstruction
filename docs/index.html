<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AJC Sistem Tapak</title>
<meta name="description" content="Sistem dalaman AJC Construction: ukuran tapak aluminium & kaca, dan kehadiran staff dengan GPS + selfie.">
<meta name="theme-color" content="#0b2545" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AJC Tapak">
<meta name="application-name" content="AJC Tapak">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preload" href="logo-white.png" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* Splash (inline supaya muncul serta-merta, sebelum CSS & JS lain dimuat) */
#splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; color: #fff; overflow: hidden;
  background: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 22px 22px,
    radial-gradient(90% 60% at 50% 38%, rgba(47,138,224,.55), rgba(47,138,224,0) 70%), linear-gradient(170deg, #1b6db4 0%, #123f73 48%, #0b2545 100%);
  transition: opacity .45s ease, transform .45s ease; }
.no-splash #splash { display: none; }
#splash.sp-out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.sp-in { display: grid; justify-items: center; gap: 22px; width: min(260px, 70vw); }
.sp-logo { width: 100%; height: auto; display: block; clip-path: inset(0 100% 0 0); animation: sp-reveal .75s cubic-bezier(.65,0,.35,1) .1s forwards; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
.sp-tape { position: relative; width: 100%; height: 14px; }
.sp-tape::before { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 0; background: rgba(255,255,255,.9); border-radius: 2px; animation: sp-line .7s cubic-bezier(.65,0,.35,1) .55s forwards; }
.sp-tape::after { content: ""; position: absolute; left: 0; top: 2px; height: 10px; width: 0; opacity: .7;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 1px, transparent 1px 13px) 0 0 / 100% 6px no-repeat,
              repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 1px, transparent 1px 65px) 0 0 / 100% 10px no-repeat;
  animation: sp-line .7s cubic-bezier(.65,0,.35,1) .55s forwards; }
.sp-cap { font: 700 11px/1 "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: .32em; text-transform: uppercase; opacity: 0; animation: sp-fade .5s ease .95s forwards; }
.sp-foot { position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 600 11px "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: .08em; opacity: 0; color: rgba(255,255,255,.65); animation: sp-fade .5s ease 1s forwards; }
@keyframes sp-reveal { to { clip-path: inset(0 0 0 0); } }
@keyframes sp-line { to { width: 100%; } }
@keyframes sp-fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sp-logo { clip-path: none; animation: none; } .sp-tape::before, .sp-tape::after { width: 100%; animation: none; } .sp-cap, .sp-foot { opacity: 1; animation: none; } }
</style>
<script>
/* Splash dipaparkan sekali setiap sesi (seperti app native bila dibuka), kemudian hilang bila app sedia. */
(function () {
  var shown = null; try { shown = sessionStorage.getItem('ajc_splash'); } catch (e) {}
  var theme = function () { var m = document.getElementById('theme-color'); if (m) m.setAttribute('content', '#ffffff'); };
  if (shown) { document.documentElement.classList.add('no-splash'); theme(); window.hideSplash = function () {}; return; }
  try { sessionStorage.setItem('ajc_splash', '1'); } catch (e) {}
  var t0 = Date.now(), done = false;
  window.hideSplash = function () {
    if (done) return; done = true;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function () {
      var el = document.getElementById('splash'); theme();
      if (!el) return; el.classList.add('sp-out');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 480);
    }, Math.max(0, (reduce ? 300 : 1500) - (Date.now() - t0)));
  };
  setTimeout(window.hideSplash, 5000); // sandaran jika app lambat
})();
</script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-in">
    <img class="sp-logo" src="logo-white.png" alt="" width="480" height="170">
    <div class="sp-tape"></div>
    <span class="sp-cap">Sistem Tapak</span>
  </div>
  <div class="sp-foot">Aluminium & Glass Specialist</div>
</div>
<div id="app"><div class="boot"><img src="logo.png" alt="AJC Construction" width="240" height="85"></div></div>
<dialog id="modal"><div id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<!-- Lapisan data: demo-backend.js (localStorage). Bila Supabase disambung, ganti fail ini sahaja. -->
<script src="demo-backend.js"></script>
<script src="app.js"></script>
</body>
</html>
